[project]
name = "codeverse-backend"
version = "0.2.0"
description = "Codeverse — AI mock interviewer backend"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "google-genai>=1.30",
    "python-dotenv>=1.0",
    # Vercel functions (codeverse/web): Neon Postgres.
    "psycopg[binary]>=3.2",
    "vercel>=0.12.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codeverse"]

[tool.ruff]
line-length = 110
target-version = "py311"
# Debug-track problems are deliberately buggy code.
extend-exclude = ["codeverse/problems/debug"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
